[project]
name = "openvalora"
version = "0.1.0"
description = "Software Aberto de Inferência Estatística e Engenharia de Avaliações (ABNT NBR 14653)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OpenValora Contributors" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
    "xlwt>=1.3.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "pywebview>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.5.0",
]

[project.scripts]
openvalora = "main:main"
valoraopen = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
